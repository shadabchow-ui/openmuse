name: External backend
on:
  push:
    branches: [external-backend]
  pull_request:
    branches: [external-backend]
permissions:
  contents: read
concurrency:
  group: external-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-patch-surface.mjs
      - run: node scripts/check-private-identifiers.mjs
      - name: Web export with the default environment
        run: pnpm --dir apps/mobile exec expo export --platform web --output-dir dist/web
      - name: Web export in external mode
        env:
          EXPO_PUBLIC_API_PREFIX: /api/gateway
          EXPO_PUBLIC_AUTH_MODE: external
          EXPO_PUBLIC_TELEMETRY: "off"
        run: pnpm --dir apps/mobile exec expo export --platform web --output-dir dist/web-ext
